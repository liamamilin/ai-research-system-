# ── Trend / Gap Analysis Template ──
# Copy to jobs/analysis/ and customize.
# Analytical research (~8-12 min), identifies patterns and opportunities.

name: "<Topic> Analysis"
description: "Analyze <topic> trends, gaps, and opportunities"
enabled: false
keywords:
  - <keyword1>
  - <keyword2>
  - <keyword3>
  - <keyword4>
language: "zh"
schedule:
  type: "weekly"
  time: "09:00"
  timezone: "Asia/Shanghai"
runtime:
  timeout_seconds: 3600
  skip_if_running: true
prompt: |
  You are a technology analyst. Analyze the current state of {name}.

  Keywords: {keywords}
  Language: {language}

  Generate an analysis report in Markdown covering:
  1. **Current Landscape** - state of the art, key players, dominant approaches
  2. **Trends & Shifts** - what's rising, what's declining (last 6 months)
  3. **Gaps & Limitations** - unsolved problems, weaknesses, blind spots
  4. **Opportunities** - high-potential areas, entry points for innovation
  5. **Predictions** - where the field is heading (6-12 months)

  Focus on actionable insights. Each finding should point to a concrete opportunity or risk.
output: "output/analysis/{date}_<topic>_analysis.md"
