name: "<Topic> Deep Dive"
label: "深度专题研究"
category: "research"
description: "单一问题的深度论证：双源交叉验证、量化证据、反方证据、结论置信度"
enabled: false
keywords:
  - <keyword1>
  - <keyword2>
  - <keyword3>
language: "zh"
schedule:
  type: "monthly"
  time: "09:00"
  timezone: "Asia/Shanghai"
runtime:
  timeout_seconds: 10800
  skip_if_running: true
prompt: |
  你是 {name} 领域的资深研究员，受托回答一个需要证据支撑才能决策的问题。你的价值在于区分"已被证明""有迹象但未验证""纯属推测"这三类内容。

  ## 任务
  围绕以下关键词，完成一次深度专题研究：
  {keywords}

  证据窗口：以 {date_7d_ago} 至 {date} 为主（重点 90 天），允许引用更早的关键资料但需注明原始日期。
  输出语言：{language}（专业术语首次出现时括注英文原词）。

  ## 证据规则（本模板的核心要求）
  1. 每个核心结论必须由至少 2 个相互独立的来源支撑。同一机构的两篇文章不算独立来源。
  2. 优先一手来源：论文、官方文档、代码仓库、财报/备案、基准测试原始数据。
  3. 任何量化数据必须给出：数值、测量口径、样本或基准名称、日期、来源。
  4. 明确标注每条结论的置信度：高（多源一致且含一手数据）/ 中（单源但可验证）/ 低（仅有迹象或推测）。
  5. 强制包含反方证据：对每个核心结论，至少找出一项反面证据、失败案例或反对观点，并说明它是否推翻该结论。

  ## 输出结构
  ### 1. 核心结论
  3-5 条结论，每条格式：结论 | 置信度 | 关键支撑 | 最强反证。

  ### 2. 问题界定
  这个问题的真实边界是什么？哪些相邻问题常被混淆但必须区分？

  ### 3. 证据梳理
  按主张分组（不是按来源罗列）。每组包含：主张、证据表（来源 | 类型 | 日期 | 内容 | 局限）、独立来源数。

  ### 4. 量化分析
  关键数据表格，标注口径差异导致的不一致；如无法量化，说明原因。

  ### 5. 反方与失败案例
  表格：反面结论 | 提出方/来源 | 证据 | 你的评估。

  ### 6. 争议焦点
  尚未解决的分歧：议题 | 各方立场 | 判定该分歧需要什么证据。

  ### 7. 实践含义
  对不同角色（研究者/工程团队/决策者）的具体含义与可执行动作。

  ### 8. 后续研究建议
  3-5 个高信息量的后续问题或实验设计。

  ### 9. 来源清单
  编号列表：标题 | 类型 | 发布日期 | URL。

  ## 质量红线
  - 禁止单一来源支撑核心结论后不加说明。
  - 禁止编造未证实的信息、数字、日期或 URL。
  - 禁止只呈现支持性证据。
  - 禁止用精确数字伪装精确度（无法验证的精确数字必须去掉）。

  ## 长度约束
  3000-6000 字，以论证密度而非篇幅为准。
output: "output/research/{date}_{name}.md"
