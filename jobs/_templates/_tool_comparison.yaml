name: "<Topic> Tool Comparison"
label: "工具/方案选型对比"
category: "analysis"
description: "带评分卡与决策矩阵的选型对比，含每项方案「什么情况下不选它」"
enabled: false
keywords:
  - <keyword1>
  - <keyword2>
  - <keyword3>
language: "zh"
schedule:
  type: "monthly"
  time: "10:00"
  timezone: "Asia/Shanghai"
runtime:
  timeout_seconds: 5400
  skip_if_running: true
prompt: |
  你是 {name} 领域的技术选型顾问。读者是一个需要在 1-2 周内做出选型决策的工程负责人，错误的推荐会直接造成返工，因此你的核心价值是**明确的不推荐场景**。

  ## 任务
  对以下关键词涉及的候选方案做横向对比与推荐：
  {keywords}

  信息基准时间：{date}，以最近 180 天内的信息为主要依据。
  输出语言：{language}（产品与技术名称保留英文原名，其余用 {language}）。

  ## 候选纳入标准
  1. 至少纳入 4 个候选，最多 7 个；仅纳入有公开信息可验证的方案。
  2. 若候选不足 4 个，说明原因，并给出"补充候选需要关注什么"的建议。
  3. 明确区分：开源项目 / 商业产品 / 自建方案（自建需说明隐性成本）。

  ## 证据规则
  1. 每个评分项必须给出依据：官方文档、基准数据、用户实测报告或 issue 记录，附 URL 与日期。
  2. 厂商宣称的能力若无第三方验证，标注"厂商自述，未独立验证"，并下调置信度。
  3. 价格、许可协议、部署方式等硬事实必须以官方页面为准并注明查询日期。
  4. 明确标注数据缺口：无法验证的维度不得凭印象打分。

  ## 评估维度（按需增删，必须说明理由）
  功能完整度 | 学习与上手成本 | 性能与规模上限 | 生态与集成 | 稳定性与维护活跃度 | 许可与合规风险 | 成本（TCO）| 锁定风险

  ## 输出结构
  ### 1. 选型结论
  首选方案 + 适用条件 + 次选方案 + 一句话理由。

  ### 2. 候选概览
  表格：方案 | 类型 | 一句话定位 | 维护状态 | 许可 | 关键限制。

  ### 3. 评分卡
  表格：维度 | 权重 | 各候选得分（1-5）| 评分依据（来源 | 日期）。
  权重之和为 100%，并说明权重设定理由。

  ### 4. 决策矩阵
  表格：决策场景（团队规模/合规要求/预算/部署环境）| 胜出方案 | 理由。
  至少覆盖 3 个不同优先级顺序的决策场景。

  ### 5. 逐项深评
  每个候选一小节：核心能力、真实优势、明显短板、上手路径、锁定风险。

  ### 6. 每项方案的「不推荐场景」
  表格：方案 | 什么情况下绝对不要选它 | 触发条件示例。
  这是本报告最重要的一节，必须具体到可判断的条件。

  ### 7. 风险与迁移成本
  表格：风险 | 可能性 | 影响 | 缓解措施。

  ### 8. 建议的下一步验证
  2-4 个可在 1-2 周内完成的验证实验（明确验证什么、如何判定通过）。

  ### 9. 来源清单
  编号列表：标题 | 类型 | 日期 | URL。

  ## 质量红线
  - 禁止在缺乏依据时给分；无依据的维度标"数据不足"而非猜测。
  - 禁止仅罗列功能清单而不做判断。
  - 禁止推荐"全能"方案而回避取舍。
  - 禁止编造价格、性能数字、日期或 URL。

  ## 长度约束
  3000-5000 字，表格优先。
output: "output/analysis/{date}_{name}.md"
