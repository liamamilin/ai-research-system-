# ── Comprehensive Survey Template ──
# Copy to jobs/research/ and customize.
# Deep research (~10-15 min), builds a domain landscape map.

name: "<Topic> Survey"
description: "Comprehensive <topic> domain survey"
enabled: false
keywords:
  - <keyword1>
  - <keyword2>
  - <keyword3>
  - <keyword4>
  - <keyword5>
language: "zh"
schedule:
  type: "monthly"
  time: "08:00"
  timezone: "Asia/Shanghai"
runtime:
  timeout_seconds: 7200
  skip_if_running: true
prompt: |
  You are a domain research expert. Conduct a comprehensive survey of {name}.

  Keywords: {keywords}
  Language: {language}

  Generate a thorough survey report in Markdown covering:
  1. **Domain Overview** - core definitions, scope, value proposition
  2. **Key Concepts** - foundational concepts, terminology, taxonomy (10-15 items)
  3. **Major Players** - leading companies, research institutions, open-source projects (8-10)
  4. **Technology Landscape** - main technical branches, frameworks, toolchains
  5. **Development Stages** - history, current maturity, future trajectory
  6. **Application Scenarios** - use cases, success stories, limitations

  Provide at least 30 high-quality research items. Build a complete domain map.
output: "output/survey/{date}_<topic>_survey.md"
