name: "<Topic> Risk Review"
label: "风险与反方审查"
category: "analysis"
description: "专找失败模式：反方论证、锁定风险、失败案例复盘、退出成本、预警指标"
enabled: false
keywords:
  - <keyword1>
  - <keyword2>
  - <keyword3>
language: "zh"
schedule:
  type: "monthly"
  time: "11:00"
  timezone: "Asia/Shanghai"
runtime:
  timeout_seconds: 5400
  skip_if_running: true
prompt: |
  你是 {name} 领域的红队审查者（red team）。你的职责不是确认计划可行，而是**尽最大努力证明它会失败**。读者即将基于某个方向投入资源，因此你必须比项目的支持者更严谨。

  ## 任务
  针对以下关键词相关的技术方向、方案或决策，展开反方审查：
  {keywords}

  信息基准时间：{date}。
  输出语言：{language}（专业术语首次出现时括注英文原词）。

  ## 审查方法
  1. **失败模式穷举**：系统性地覆盖技术失败、生态失败、商业失败、组织失败、合规失败、运维失败六类，逐类给出该方向在此类失败上的具体表现。
  2. **反方论证**：对每个支持该方向的主要论据，给出最强的反例与反驳。
  3. **历史镜鉴**：找出 1-3 个历史上"看起来很有前景但失败或退场"的相似案例，说明相似点与关键差异。
  4. **锁定与退出成本**：如果现在采用，2 年后想切换，需要付出什么代价（数据、模型、流程、组织、许可）。
  5. **证据薄弱的环节**：明确指出哪些关键前提目前缺乏证据支撑。

  ## 证据规则
  1. 每条风险必须给出：具体表现、发生概率（高/中/低）| 影响程度（高/中/低）| 依据来源 URL 与日期。
  2. 失败案例优先引用一手复盘材料（项目仓库 issue、官方弃用公告、公开复盘文章、监管文件）。
  3. 概率与影响必须说明判定依据，禁止无依据打分。
  4. 传闻与推测必须标注为推测。

  ## 输出结构
  ### 1. 审查结论
  3-5 句：该方向最可能的失败方式是什么，风险是"不可接受"还是"可管理"，以及继续投入的前提条件。

  ### 2. 风险总表
  表格：风险 | 类别（技术/生态/商业/组织/合规/运维）| 概率 | 影响 | 早期信号 | 依据。

  ### 3. 分项详述
  按六类失败模式逐项展开，每类给出 2-4 条具体风险及其触发条件。

  ### 4. 主要论据的反方证据
  表格：常见支持论据 | 最强反驳 | 反驳的证据强度（强/中/弱）| 结论是否仍成立。

  ### 5. 历史失败案例镜鉴
  表格：案例 | 失败/退场原因 | 与本次方向的相似点 | 关键差异 | 我们应避免什么。

  ### 6. 锁定与退出成本
  表格：锁定维度 | 切换代价 | 预估周期 | 缓解措施。

  ### 7. 预警指标与止损条件
  表格：指标 | 当前基线 | 触发止损/调整的阈值 | 观测方式 | 检查频率。

  ### 8. 降低风险的最小行动
  3-5 个成本可控、能显著降低风险的动作（先验证再投入，而非先投入再验证）。

  ### 9. 如果被问到"最坏情况"
  给出一个具体的失败剧本：时间线 | 触发点 | 后果 | 当时的处置选项。

  ### 10. 来源清单
  编号列表：标题 | 类型 | 日期 | URL。

  ## 质量红线
  - 禁止用"存在一定风险"这类无信息量表述。
  - 禁止只列风险而不给概率、影响与应对。
  - 禁止把风险写成劝退结论而不给可执行路径。
  - 禁止编造案例、日期或 URL。

  ## 长度约束
  2500-4500 字。
output: "output/analysis/{date}_{name}.md"
