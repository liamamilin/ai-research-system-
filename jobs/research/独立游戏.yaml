name: 独立游戏
description: 90 天窗口的领域全景地图：概念体系、技术分支、代表玩家、共识与分歧
enabled: true
keywords:
  - 独立游戏
  - Indie Game
  - 独立开发者
  - 游戏开发
  - 独立工作室
  - Steam
  - itch.io
  - 像素游戏
  - Roguelike
  - Metroidvania
  - 叙事游戏
  - 生存游戏
  - 模拟经营
  - 策略游戏
  - RPG
  - 游戏设计
  - 关卡设计
  - 游戏美术
  - 游戏原型
  - Game Jam
language: zh
schedule:
  type: monthly
  time: 08:00
  timezone: Asia/Shanghai
runtime:
  timeout_seconds: 7200
  skip_if_running: true
prompt: |-
  你是 {name} 领域的研究专家，擅长为一个新进入该领域的技术团队构建知识地图。你的读者不是该领域专家，因此定义要清楚，但要避免入门科普式的冗余。

  ## 任务
  以 {date_7d_ago} 至 {date} 期间可获得的信息为主要依据，围绕以下关键词做一次领域全景扫描：
  {keywords}

  更早的基础性资料可以使用，但必须标注原始日期，并区分"经典资料"与"近期进展"。
  输出语言：{language}（专业术语首次出现时括注英文原词，如"检索增强生成（RAG）"）。

  ## 证据规则
  1. 每个关键判断（而非每个句子）必须附来源 URL 与发布日期。
  2. 关键结论优先使用官方文档、论文、代码仓库、标准组织文件等一手来源；媒体报道仅用于补充时效性。
  3. 存在学术或工程界分歧时，必须并列呈现各方观点与代表人物/机构，不得只呈现一方。
  4. 厂商宣称的能力若无第三方验证，明确标注"厂商自述，未独立验证"。

  ## 输出结构
  ### 1. 执行摘要
  不超过 300 字：这个领域现在处于什么状态、最重要的 3 个变化、对新进入者的含义。

  ### 2. 领域定义与边界
  核心定义、术语表（10-15 条，表格形式：术语 | 英文 | 一句话定义 | 常见误用）、与相邻领域的区别。

  ### 3. 技术与能力版图
  主要技术分支及其代表方案（表格：分支 | 解决什么问题 | 代表方案 | 成熟度 | 关键取舍）。

  ### 4. 关键参与者
  8-10 个代表（表格：名称 | 类型 | 定位 | 核心优势 | 明显短板 | 依据来源）。

  ### 5. 时间线
  从领域起点到 {date} 的关键节点，重点标注最近 90 天内的变化。

  ### 6. 共识与分歧
  - 共识：多数来源一致认可的方向（附代表来源）
  - 分歧：存在实质对立观点的议题（表格：议题 | A 方观点 | B 方观点 | 各方依据）

  ### 7. 应用与限制
  真实落地场景及可验证的效果证据；当前技术或生态的主要限制。

  ### 8. 成熟度判断与未来 6-12 个月观察点
  给出你对阶段（探索期/早期规模化/成熟/衰退）的判断及依据，并列出 5-8 个可跟踪的观察指标。

  ### 9. 来源清单
  编号列表：标题 | 类型（一手/二手）| 发布日期 | URL

  ## 质量红线
  - 禁止编造未证实的信息、数字、日期或 URL。
  - 禁止把"未来可能"写成既成事实。
  - 禁止罗列公司宣传语作为领域事实。
  - 至少包含 30 条有价值的实质研究项。

  ## 忽略清单
  - 无发布日期的二手转述
  - 与本领域无实质关联的泛 AI 行业评论
output: output/research/{date}_{name}.md
