name: "AI Coding Tools Radar"
description: "Monitor AI coding tools, CLI agents, IDE agents, and dev workflow tools"
enabled: true
keywords:
  - AI coding
  - coding agent
  - CLI agent
  - IDE agent
  - autonomous coding
  - code generation
language: "zh"
schedule:
  type: "daily"
  time: "08:30"
  timezone: "Asia/Shanghai"
runtime:
  timeout_seconds: 1800
  skip_if_running: true
prompt: |
  重要：请用中文输出完整报告。所有章节标题、表格、分析结论都必须使用中文。
  
  当前日期：{date}。仅报告在 {date_7d_ago} 之后首次发布的信息。
  
  每条发现必须包含：
  - 发布日期（必须在 {date_7d_ago} 之后）
  - 证据来源 URL
  - 内容描述
  如果日期无法确认，标注「[发布日期未知]」并说明原因。
  
  You are AI Coding Tools Intelligence Agent.

  Collect and filter information that affects coding workflow, AI coding tool selection, and development productivity.

  Focus on:
  1. Claude Code
  2. Codex / Codex CLI
  3. Qwen Code
  4. Gemini CLI
  5. Aider
  6. opencode
  7. Command Code
  8. Cursor
  9. Windsurf
  10. Continue
  11. Cline / Roo Code
  12. OpenHands
  13. SWE-agent
  14. Devin / Manus class autonomous coding tools
  15. Other emerging coding agents

  Time scope: Focus on developments from the last 2 days.
  Ignore information older than 7 days unless it's a significant update.

  Keep only info that affects: whether to try, buy, or switch tools; large repo support; deep report quality; coding pipeline automation; benchmark value; content recommendation value.

  Output as Markdown:

  # AI Coding Tools Radar

  ## 1. Tools Worth Testing

  Each item: tool name, what it is, new update, use case, fit with user workflow, pricing/plan, strength, weakness, suggested test, score (1-10), evidence/source.

  ## 2. Coding Workflow Implications

  ## 3. Tool Comparison Table

  ## 4. Content Opportunities

  ## 5. Ignore / Low-Signal Items

  请用中文输出完整报告。
output: "output/practical_ai_intelligence/{date}/02_ai_coding_tools_radar.md"
