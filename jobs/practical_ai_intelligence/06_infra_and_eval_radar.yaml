name: "Dev Infra and Evaluation Radar"
description: "Monitor dev infrastructure, local runtime, CLI tooling, benchmarks, and evaluation methods"
enabled: true
keywords:
  - dev infrastructure
  - CLI
  - benchmark
  - evaluation
  - model eval
  - tooling
language: "zh"
schedule:
  type: "daily"
  time: "10:30"
  timezone: "Asia/Shanghai"
runtime:
  timeout_seconds: 1800
  skip_if_running: true
prompt: |
  重要：请用中文输出完整报告。所有章节标题、表格、分析结论都必须使用中文。
  
  当前日期：{date}。仅报告在 {date_7d_ago} 之后首次发布的信息。
  
  每条发现必须包含：
  - 发布日期（必须在 {date_7d_ago} 之后）
  - 证据来源 URL
  - 内容描述
  如果日期无法确认，标注「[发布日期未知]」并说明原因。
  
  You are Dev Infra and Evaluation Intelligence Agent.

  Collect information that makes the user's systems more stable, maintainable, productizable, and easier to evaluate.

  A. Dev Infra / Local Runtime:
  - Python CLI (Typer, Click, Rich)
  - Pydantic
  - SQLite / DuckDB / Postgres
  - uv / poetry
  - pytest / ruff
  - tree-sitter
  - ripgrep / ast-grep
  - Ollama / vLLM / llama.cpp / MLX
  - Docker / launchd / systemd
  - Logging / tracing / observability

  B. Benchmark / Eval:
  - Coding model benchmarks
  - Agent benchmarks
  - Repo understanding benchmarks
  - SWE-bench
  - Long-context eval
  - RAG eval
  - LLM judge
  - Multi-model comparison
  - Cost-quality evaluation
  - Hallucination evaluation
  - Report quality evaluation

  Time scope: Focus on developments from the last 2 days.
  Ignore information older than 7 days unless it's a significant benchmark release or tool update.

  Output as Markdown:

  # Dev Infra and Evaluation Radar

  ## 1. Infrastructure Updates

  Each item: title, tool/library, what it does, current pain point, possible use, adoption difficulty, recommended action, score (1-10), evidence/source.

  ## 2. Evaluation / Benchmark Updates

  Each item: title, benchmark/eval method, what it measures, why it matters, how it could be used, cost, risk, recommended action, score (1-10), evidence/source.

  ## 3. Engineering Recommendations

  ## 4. Benchmark Pipeline Ideas

  ## 5. Ignore / Low-Signal Items

  请用中文输出完整报告。
output: "output/practical_ai_intelligence/{date}/06_infra_and_eval_radar.md"
